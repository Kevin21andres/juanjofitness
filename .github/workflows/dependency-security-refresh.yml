name: Upgrade vulnerable dependencies
on:
  push:
    branches:
      - feature/gestion-blog-juanjo
    paths:
      - .github/workflows/dependency-security-refresh.yml
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gestion-blog-juanjo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade stable, patched framework versions
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0 react@19.3.0 react-dom@19.3.0
      - name: Apply non-breaking transitive fixes
        run: npm audit fix || true
      - name: Validate lint and production build
        run: |
          npm run lint
          npm run build
      - name: Check production dependency vulnerabilities
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          node - <<'NODE'
          const audit = require('./production-audit.json');
          console.log('PRODUCTION_AUDIT_COUNTS', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
            console.log('PRODUCTION_AUDIT_PACKAGE', JSON.stringify({ name, severity: v.severity, fixAvailable: v.fixAvailable }));
          }
          NODE
      - name: Commit verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already up to date"
          else
            git commit -m "security: upgrade Next.js, React and patched dependencies"
            git push origin HEAD:feature/gestion-blog-juanjo
          fi
